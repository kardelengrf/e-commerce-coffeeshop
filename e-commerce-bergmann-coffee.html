<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Bergmann Coffee – clickable e-commerce prototype. Specialty coffee roasted in Berlin.">
<meta name="theme-color" content="#F7F7F5">
<title>Bergmann Coffee Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: one mobile column (max 440px) taken from the Bergmann wireframes, centred on a neutral ground at desktop widths. Single light brand look, set explicitly. */
:root{
  color-scheme:light;
  --ground:#E9E8E4;
  --bg:#F7F7F5;
  --surface:#FFFFFF;
  --ink:#1A1A1A;
  --ink-2:#3F3F3F;
  --muted:#8A8A86;
  --line:#D6D6D2;
  --orange:#E94E1B;
  --orange-press:#CF4213;
  --peach:#E9CFB7;
  --night:#1B1B1B;
  --on-night:#F7F7F5;
  --on-night-2:#A7A7A3;
  --ok:#1A1A1A;
  --err:#C0341A;
  --display:"Manrope", "Helvetica Neue", Arial, sans-serif;
  --body:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:6px;            /* buttons, inputs */
  --r-card:10px;      /* cards & images */
  --ease:cubic-bezier(0.2, 0, 0, 1);
}
*{box-sizing:border-box}
html,body{background:var(--ground)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-left:max(0px, env(safe-area-inset-left,0px));padding-right:max(0px, env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
img{display:block;max-width:100%}
.app{max-width:440px;margin:0 auto;background:var(--bg);min-height:100vh;position:relative;overflow-x:clip;box-shadow:0 0 0 1px rgba(0,0,0,.04), 0 20px 60px -30px rgba(0,0,0,.25)}
.g{padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- header ---------- */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;height:64px;background:var(--bg);transition-property:background-color,color;transition-duration:.2s}
.hdr.over{background:transparent;color:#fff;margin-bottom:-64px}
.hdr.over.solid{background:var(--bg);color:var(--ink)}
.logo{justify-self:center;font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.01em}
.hbtn{width:44px;height:44px;display:grid;place-items:center;position:relative}
.hbtn svg{width:28px;height:28px}
.hbtn.right{justify-self:end}
.cbadge{position:absolute;top:5px;right:2px;min-width:17px;height:17px;border-radius:9px;border:1.5px solid currentColor;background:var(--bg);color:var(--ink);font-size:10.5px;font-weight:600;display:grid;place-items:center;padding:0 4px;font-variant-numeric:tabular-nums}
.hdr.over:not(.solid) .cbadge{background:#fff;border-color:#fff}
.cbadge.bump{animation:bump .35s var(--ease)}
@keyframes bump{50%{transform:scale(1.3)}}

/* ---------- menu ---------- */
.menu{position:fixed;inset:0;z-index:60;display:flex;justify-content:center;pointer-events:none}
.menu .sheet{width:100%;max-width:440px;background:var(--bg);opacity:0;transform:translateY(-8px);transition-property:opacity,transform;transition-duration:.22s;transition-timing-function:var(--ease);padding-bottom:28px;padding-top:env(safe-area-inset-top,0px);box-shadow:0 30px 60px -20px rgba(0,0,0,.35);align-self:flex-start}
.menu .scrim{position:absolute;inset:0;background:rgba(0,0,0,.3);opacity:0;transition:opacity .22s var(--ease)}
.menu.open{pointer-events:auto}
.menu.open .sheet{opacity:1;transform:none}
.menu.open .scrim{opacity:1}
.menu .sheet{position:relative;z-index:1}
.menu nav{display:flex;flex-direction:column;gap:6px;padding:8px 26px 0}
.menu nav button{align-self:flex-start;font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.02em;text-transform:uppercase;padding:4px 0;text-underline-offset:5px}
.menu nav button[aria-current="page"]{text-decoration:underline;text-decoration-thickness:1.5px}

/* ---------- type ---------- */
.crumb{font-size:12.5px;color:var(--muted);padding-top:12px}
.crumb button{color:inherit}
.crumb button:hover{color:var(--ink)}
.h1{font-family:var(--display);font-weight:800;font-size:38px;line-height:1;letter-spacing:-.03em;text-transform:uppercase;margin:6px 0 0;text-wrap:balance}
.h2{font-family:var(--display);font-weight:800;font-size:27px;line-height:1.05;letter-spacing:-.035em;text-transform:uppercase;margin:0;text-wrap:balance}
.h3{font-family:var(--display);font-weight:600;font-size:22px;line-height:1.2;letter-spacing:-.01em;margin:0;text-wrap:balance}
.lead{font-size:16px;color:var(--ink-2);margin:6px 0 0;text-wrap:pretty}
.eyebrow{font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.more{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:16px;color:var(--ink-2)}
.more:hover{color:var(--ink)}

/* ---------- buttons ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:50px;border-radius:var(--r);background:var(--orange);color:#fff;font-family:var(--display);font-weight:600;font-size:16px;transition-property:background-color,scale,opacity;transition-duration:.15s;transition-timing-function:var(--ease)}
.btn:hover{background:var(--orange-press)}
.btn:active{scale:.96}
.btn.sm{height:38px;font-size:15px}
.btn.line{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.btn.line:hover{background:rgba(0,0,0,.04)}
.btn[disabled]{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);cursor:not-allowed;scale:1}
.stepper{display:inline-flex;align-items:center;gap:8px}
.stepper button{width:30px;height:22px;border-radius:5px;box-shadow:inset 0 0 0 1px var(--ink-2);display:grid;place-items:center;font-size:15px;line-height:1;transition:scale .15s var(--ease)}
.stepper button:active{scale:.96}
.stepper span{min-width:12px;text-align:center;font-size:14px;font-variant-numeric:tabular-nums}
.stepper.lg button{width:36px;height:28px}
.stepper.lg span{font-size:17px;min-width:18px}

/* ---------- media ---------- */
.ph{background:var(--peach);border-radius:var(--r-card);overflow:hidden;position:relative;outline:1px solid rgba(0,0,0,.08);outline-offset:-1px}
.ph img{width:100%;height:100%;object-fit:cover}
.tags{position:absolute;top:14px;left:14px;display:flex;gap:6px}
.tags span{border:1px solid rgba(255,255,255,.9);color:#fff;font-size:11px;font-weight:600;letter-spacing:.05em;padding:3px 9px;border-radius:4px;background:rgba(0,0,0,.08)}

/* ---------- home ---------- */
.hero{position:relative;min-height:780px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;padding-block:150px 32px;overflow:hidden;isolation:isolate}
.hero .bg{position:absolute;inset:0;z-index:-1;background-size:cover;background-position:center 35%;animation:heroZoom 1.6s var(--ease) both}
.hero .bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.4) 0%,rgba(10,8,6,.22) 14%,rgba(10,8,6,.42) 32%,rgba(10,8,6,.3) 50%,rgba(10,8,6,.05) 64%,rgba(20,12,6,.35) 80%,rgba(20,12,6,.7) 100%)}
@keyframes heroZoom{from{scale:1.06}to{scale:1}}
.hero .in{display:flex;flex-direction:column;gap:16px;text-align:center}
.hero .in>*{animation:rise .6s var(--ease) both}
.hero .top>:nth-child(2){animation-delay:.1s}.hero .bot>:nth-child(1){animation-delay:.2s}.hero .bot>:nth-child(2){animation-delay:.3s}
@keyframes rise{from{opacity:0;translate:0 10px}to{opacity:1;translate:0 0}}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(36px, 10.5vw, 44px);line-height:.98;letter-spacing:-.04em;text-transform:uppercase;margin:0;text-wrap:balance;text-shadow:0 2px 24px rgba(0,0,0,.3)}
.hero p{margin:0 auto;font-size:16.5px;font-weight:500;line-height:1.45;text-wrap:balance;max-width:330px;text-shadow:0 1px 10px rgba(0,0,0,.35)}
.hero .btn{box-shadow:0 10px 24px -10px rgba(233,78,27,.7)}
.usp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-size:13px;font-weight:500;line-height:1.3;padding-block:10px 6px;text-shadow:0 1px 8px rgba(0,0,0,.4)}
.usp span{display:flex;flex-direction:column;align-items:center;gap:6px}
.usp svg{width:22px;height:22px;opacity:.95}
.sec{padding-block:56px 0}
.rowhead .h2{font-size:24px}
.rowhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.hscroll{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-inline:16px;scrollbar-width:none;padding-bottom:4px}
.hscroll::-webkit-scrollbar{display:none}
.hscroll>*{scroll-snap-align:start;flex:none}
.best{width:76%;display:flex;flex-direction:column;gap:10px}
.best .ph{aspect-ratio:323/388}
.pline{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pline b{font-weight:600;font-size:15px}
.pline .tnum{font-weight:600;font-size:17px}
.sub{font-size:13px;color:var(--muted);margin-top:-2px}
.quizband{position:relative;margin-top:56px;color:#fff;text-align:center;padding-block:96px 104px;overflow:hidden}
.quizband .bg{position:absolute;inset:0;background-size:cover;background-position:center}
.quizband .bg::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 40%,rgba(0,0,0,.35),rgba(0,0,0,.75))}
.quizband .in{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px}
.quizband p{margin:0 0 22px;font-weight:500;font-size:15.5px;text-wrap:balance;max-width:330px}
.quizband .btn{max-width:300px}
.promo{display:flex;flex-direction:column;gap:16px;margin-top:28px}
.pcard{border:1px solid var(--ink);border-radius:var(--r-card);padding:12px 12px 18px;display:flex;flex-direction:column;gap:6px;text-align:left;width:100%;transition:scale .15s var(--ease)}
.pcard:active{scale:.98}
.pcard .ph{aspect-ratio:1/1;border-radius:6px;margin-bottom:12px}
.pcard .t,.pcard .eyebrow,.pcard p{padding:0 10px}
.pcard .t{font-family:var(--display);font-weight:600;font-size:18px}
.pcard p{margin:0;color:var(--muted);font-size:14.5px}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:20px 18px;margin-top:28px}
.cat{display:flex;flex-direction:column;gap:8px;text-align:left}
.cat .ph{aspect-ratio:1/0.98;transition:scale .2s var(--ease)}
.cat:hover .ph{scale:1.02}
.cat span{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.02em;text-transform:uppercase}
.story p{margin:14px 0 0;color:var(--ink-2);font-size:16px;line-height:1.55;text-wrap:pretty}
.landscape{aspect-ratio:484/432;margin-top:24px}
.rating{display:flex;align-items:center;gap:10px;margin-top:18px}
.rating b{font-family:var(--display);font-weight:500;font-size:22px}
.stars{display:inline-flex;gap:3px;color:var(--ink-2)}
.stars svg{width:18px;height:18px}
.stars.or{color:var(--orange)}
.small-caps{font-size:11.5px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;margin-top:6px}
.rev{width:82%;border:1px solid var(--ink-2);border-radius:var(--r-card);padding:18px;display:flex;flex-direction:column;gap:8px}
.rev .who{display:flex;gap:10px;align-items:center;font-size:15px}
.rev .who small{color:var(--muted);font-size:13px;display:inline-flex;gap:3px;align-items:center}
.rev .who small svg{width:12px;height:12px}
.rev .what{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.rev p{margin:0;font-size:14px;color:var(--ink-2)}

/* ---------- footer ---------- */
.ftr{background:var(--night);color:var(--on-night);margin-top:72px;padding-block:48px 40px}
.ftr .logo{justify-self:start;font-size:26px;display:block}
.fcols{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:22px}
.fcols div{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.fcols .big button{font-family:var(--display);font-weight:500;font-size:17px}
.fcols .sm button{font-size:15px;color:var(--on-night-2)}
.fcols button:hover{color:var(--on-night)}
.fbot{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:64px;font-size:14px;color:var(--on-night-2)}
.fbot button{color:inherit;text-align:left}

/* ---------- shop ---------- */
.cattabs{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.cattabs button{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:var(--r);box-shadow:inset 0 0 0 1.5px var(--ink);font-size:13.5px;font-weight:500;transition-property:background-color,color,scale;transition-duration:.15s}
.cattabs button svg{width:18px;height:18px}
.cattabs button[aria-pressed="true"]{background:var(--orange);color:#fff;box-shadow:none}
.cattabs button:active{scale:.96}
.search{margin-top:20px;display:flex;align-items:center;gap:10px;height:50px;border-radius:var(--r);box-shadow:inset 0 0 0 1px var(--line);background:var(--surface);padding:0 14px}
.search svg{width:20px;height:20px;color:var(--muted);flex:none}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:14.5px}
.search input::placeholder{color:var(--muted)}
.fbtn{margin-top:20px;width:100%;height:36px;border-radius:var(--r);box-shadow:inset 0 0 0 1px var(--ink-2);display:flex;align-items:center;justify-content:center;gap:8px;font-size:14.5px}
.fbtn svg{width:18px;height:18px}
.fpanel{margin-top:10px;padding:14px;border-radius:var(--r-card);background:var(--surface);box-shadow:0 0 0 1px var(--line);display:flex;flex-direction:column;gap:10px}
.fchips{display:flex;flex-wrap:wrap;gap:8px}
.fchips button{height:32px;padding:0 12px;border-radius:16px;box-shadow:inset 0 0 0 1px var(--line);font-size:13.5px;transition-property:background-color,color;transition-duration:.15s}
.fchips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);box-shadow:none}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:34px 16px;margin-top:20px}
.pc{display:flex;flex-direction:column;gap:6px;min-width:0}
.pc .ph{aspect-ratio:152/148;cursor:pointer}
.pc .nm{font-weight:600;font-size:14.5px;line-height:1.25;margin-top:8px;text-align:left}
.pc .sub{font-size:12px}
.pc .row{display:flex;justify-content:space-between;align-items:center;gap:6px;margin:2px 0 6px}
.pc .pr{font-size:17px;font-variant-numeric:tabular-nums}
.empty{padding:40px 0;text-align:center;color:var(--muted)}

/* ---------- product ---------- */
.gallery{position:relative;margin-top:12px}
.gallery .track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:var(--r-card)}
.gallery .track::-webkit-scrollbar{display:none}
.gallery .ph{flex:none;width:100%;aspect-ratio:303/326;scroll-snap-align:start;border-radius:0}
.gallery .ph img.bag{object-fit:contain;padding:12% 18% 6%}
.dots{position:absolute;right:12px;bottom:12px;display:flex;gap:5px}
.dots i{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.55);transition-property:width,background-color;transition-duration:.2s}
.dots i.on{width:16px;background:#fff}
.pdh{font-family:var(--display);font-weight:500;font-size:21px;margin:18px 0 0;letter-spacing:-.01em}
.prate{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted);margin-top:4px}
.prow{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.bigprice{font-family:var(--display);font-weight:800;font-size:32px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.fld{display:flex;flex-direction:column;gap:8px;margin-top:20px}
.fld>label,.fld>.lbl{font-size:13.5px;font-weight:500}
.wseg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.wseg button{height:44px;border-radius:var(--r);box-shadow:inset 0 0 0 1px var(--ink-2);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;font-weight:600;font-size:14px;transition-property:background-color,color,scale;transition-duration:.15s}
.wseg button small{font-weight:400;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.wseg button[aria-pressed="true"]{background:var(--orange);color:#fff;box-shadow:none}
.wseg button[aria-pressed="true"] small{color:rgba(255,255,255,.85)}
.wseg button:active{scale:.96}
.select{position:relative}
.select select{appearance:none;width:100%;height:48px;border-radius:var(--r);border:0;box-shadow:inset 0 0 0 1px var(--ink-2);background:var(--bg);padding:0 40px 0 14px;font-weight:500}
.select svg{position:absolute;right:14px;top:50%;width:18px;height:18px;translate:0 -50%;pointer-events:none}
.acc{margin-top:36px;border-top:1px solid var(--line)}
.acc details{border-bottom:1px solid var(--line)}
.acc summary{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:16px 0;font-size:12.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;cursor:pointer}
.acc summary::-webkit-details-marker{display:none}
.acc summary svg{width:18px;height:18px;transition:rotate .2s var(--ease)}
.acc details[open] summary svg{rotate:180deg}
.acc .body{padding:0 0 18px;color:var(--ink-2);font-size:14.5px;display:flex;flex-direction:column;gap:10px}
.acc .body p{margin:0;text-wrap:pretty}
.spec{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13.5px}
.spec dt{color:var(--muted)}
.spec dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.notechips{display:flex;flex-wrap:wrap;gap:6px}
.notechips span{background:var(--peach);border-radius:4px;padding:3px 10px;font-size:13px;color:var(--ink)}
.recipe{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.recipe div{background:var(--surface);border-radius:8px;box-shadow:0 0 0 1px var(--line);padding:10px;display:flex;flex-direction:column;gap:2px}
.recipe b{font-family:var(--display);font-size:17px;font-variant-numeric:tabular-nums}
.recipe span{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.rlist{display:flex;flex-direction:column;margin-top:14px}
.rlist .r{padding:18px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.rlist .r b{font-weight:500}
.rlist .r p{margin:0;color:var(--ink-2);font-size:14px}
.rlist .r small{color:var(--muted);font-size:13px}
.stickycta{margin-top:12px;position:sticky;bottom:0;z-index:20;padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,rgba(247,247,245,0),var(--bg) 30%)}

/* ---------- cart / checkout ---------- */
.ccard{border:1px solid var(--ink-2);border-radius:var(--r-card);padding:14px;display:grid;grid-template-columns:96px 1fr;gap:16px;position:relative}
.ccard .ph{aspect-ratio:96/98;cursor:pointer}
.ccard .info{display:flex;flex-direction:column;gap:2px;min-width:0;padding-right:20px}
.ccard .k{font-size:11.5px;letter-spacing:.05em;color:var(--muted);text-transform:uppercase}
.ccard .n{font-family:var(--display);font-weight:500;font-size:16.5px;line-height:1.25}
.ccard .v{font-size:13.5px;color:var(--muted)}
.ccard .b{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:8px}
.ccard .x{position:absolute;top:10px;right:10px;width:28px;height:28px;display:grid;place-items:center;color:var(--muted)}
.ccard .x svg{width:16px;height:16px}
.ccard .x:hover{color:var(--ink)}
.clist{display:flex;flex-direction:column;gap:12px;margin-top:24px}
.sums{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:28px;font-size:16px}
.sums .m{color:var(--muted)}
.sums .tot{font-size:16px;align-self:center}
.sums .totv{font-family:var(--display);font-weight:800;font-size:27px;letter-spacing:-.02em}
.freebar{margin-top:18px;font-size:13.5px;color:var(--ink-2);display:flex;flex-direction:column;gap:8px}
.freebar .bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.freebar .bar i{display:block;height:100%;background:var(--orange);transition:width .3s var(--ease)}
.stack{display:flex;flex-direction:column;gap:12px;margin-top:32px}
.secure{display:flex;justify-content:center;align-items:center;gap:5px;font-size:12.5px;color:var(--muted);margin-top:4px}
.secure svg{width:13px;height:13px}
.steps{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:22px;font-size:13px}
.steps .s{display:flex;align-items:center;gap:6px;color:var(--muted)}
.steps .s i{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--line);display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:600}
.steps .s.on{color:var(--ink);font-weight:600}
.steps .s.on i,.steps .s.done i{background:var(--orange);color:#fff;box-shadow:none}
.steps .s.done{color:var(--ink-2)}
.steps .s.done i svg{width:12px;height:12px}
.steps hr{width:46px;border:0;border-top:1px solid var(--line);margin:0}
.formh{font-family:var(--display);font-weight:700;font-size:19px;margin:28px 0 12px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/-1}
.inp{display:flex;flex-direction:column;gap:4px;min-width:0}
.inp input,.inp select,.inp textarea{width:100%;height:46px;border-radius:var(--r);border:0;box-shadow:inset 0 0 0 1px var(--line);background:var(--bg);padding:0 14px;font-size:14.5px;outline:0;transition:box-shadow .15s}
.inp textarea{height:110px;padding:12px 14px;resize:vertical}
.inp select{appearance:none}
.inp input::placeholder,.inp textarea::placeholder{color:var(--muted)}
.inp input:focus,.inp select:focus,.inp textarea:focus{box-shadow:inset 0 0 0 1.5px var(--ink)}
.inp.bad input,.inp.bad textarea{box-shadow:inset 0 0 0 1.5px var(--err)}
.inp .e{font-size:12px;color:var(--err)}
.check{display:flex;align-items:center;gap:10px;font-size:14px;margin-top:12px}
.check input{width:16px;height:16px;accent-color:var(--ink)}
.prefill{font-size:13px;font-weight:600;text-decoration:underline;text-underline-offset:3px;color:var(--ink-2)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:8px;box-shadow:inset 0 0 0 1px var(--line);text-align:left;width:100%;transition:box-shadow .15s}
.opt[aria-checked="true"]{box-shadow:inset 0 0 0 2px var(--ink)}
.opt .rd{width:20px;height:20px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--muted);flex:none;display:grid;place-items:center}
.opt[aria-checked="true"] .rd{box-shadow:inset 0 0 0 1.5px var(--ink)}
.opt[aria-checked="true"] .rd::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--ink)}
.opt .t{flex:1;min-width:0}
.opt .t b{display:block;font-weight:500;font-size:14.5px}
.opt .t span{font-size:12.5px;color:var(--ink-2)}
.opt .p{font-weight:600;font-variant-numeric:tabular-nums}
.opt .logos{display:flex;gap:4px;align-items:center}
.paygroup{border-radius:8px;box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.paygroup .opt{border-radius:0;box-shadow:none;border-bottom:1px solid var(--line)}
.paygroup .opt:last-of-type{border-bottom:0}
.paygroup .opt[aria-checked="true"]{background:var(--surface)}
.paynote{padding:12px 16px 14px 50px;font-size:12.5px;color:var(--ink-2);background:var(--surface);border-bottom:1px solid var(--line)}
.plogo{height:22px;padding:0 6px;border-radius:3px;display:inline-grid;place-items:center;font-size:10px;font-weight:800;letter-spacing:.02em}
.shipto{background:#EFEFEC;padding:16px;margin-top:22px;border-radius:2px;display:flex;flex-direction:column;gap:4px;font-size:14.5px}
.shipto .top{display:flex;justify-content:space-between;color:var(--ink-2)}
.shipto .top button{font-weight:600;font-size:13px;color:var(--ink)}
.shipto .nm{font-weight:500}
.shipto .ad{color:var(--ink-2)}
.shipto .mt{border-top:1px solid var(--line);margin-top:8px;padding-top:10px;color:var(--ink-2)}
.osum summary{list-style:none;display:flex;justify-content:space-between;align-items:center;font-family:var(--display);font-weight:500;font-size:18px;padding:26px 0 14px;cursor:pointer}
.osum summary::-webkit-details-marker{display:none}
.osum summary svg{width:22px;height:22px;transition:rotate .2s var(--ease)}
.osum[open] summary svg{rotate:180deg}

/* ---------- confirmation ---------- */
.okdone{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;padding-top:44px}
.okdone .tick{width:64px;height:64px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;animation:pop .45s var(--ease) both}
.okdone .tick svg{width:28px;height:28px}
@keyframes pop{from{scale:.25;opacity:0;filter:blur(4px)}to{scale:1;opacity:1;filter:blur(0)}}
.okdone h1{font-family:var(--display);font-weight:700;font-size:24px;margin:10px 0 0}
.okdone p{margin:0;color:var(--ink-2);max-width:300px;text-wrap:balance}
.ordno{font-size:12.5px;letter-spacing:.05em;color:var(--muted);text-transform:uppercase}
.eta{border:1.5px solid var(--ink);padding:18px;margin-top:28px;display:flex;flex-direction:column;gap:6px}
.eta b{font-weight:600;font-size:16px}
.eta span{font-size:14.5px}
.eta small{font-size:12px;color:var(--ink-2)}
.help{text-align:center;margin-top:28px;font-size:14px;color:var(--ink-2);display:flex;flex-direction:column;gap:8px;align-items:center}
.help button{font-weight:600;color:var(--ink);text-decoration:underline;text-underline-offset:3px}

/* ---------- quiz ---------- */
.qhead{display:flex;justify-content:space-between;align-items:flex-start}
.qx{width:40px;height:40px;display:grid;place-items:center;margin-top:6px;margin-right:-8px}
.qx svg{width:22px;height:22px}
.qprog{margin-top:24px;font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums}
.qprog .bar{height:4px;background:#EAEAE6;margin-top:6px}
.qprog .bar i{display:block;height:100%;background:var(--ink-2);transition:width .35s var(--ease)}
.qq{margin-top:28px}
.qq .eyebrow{color:var(--muted);font-size:11.5px}
.qq h2{font-family:var(--display);font-weight:500;font-size:18px;margin:6px 0 0}
.qopts{display:flex;flex-direction:column;gap:16px;margin-top:28px}
.qopt{display:flex;align-items:center;gap:16px;height:58px;padding:0 16px;border-radius:5px;box-shadow:inset 0 0 0 1px var(--line);text-align:left;font-size:12.5px;font-weight:500;letter-spacing:.02em;text-transform:uppercase;transition-property:box-shadow,scale;transition-duration:.15s;transition-timing-function:var(--ease)}
.qopt:active{scale:.98}
.qopt .bx{width:26px;height:26px;border-radius:5px;box-shadow:inset 0 0 0 1px var(--ink-2);flex:none;transition:background-color .15s}
.qopt[aria-checked="true"]{box-shadow:inset 0 0 0 1px var(--ink)}
.qopt[aria-checked="true"] .bx{background:var(--ink)}
.qnext{margin-top:56px}
.qview{animation:qin .3s var(--ease) both}
@keyframes qin{from{opacity:0;translate:0 6px}to{opacity:1;translate:0 0}}
.match{text-align:center;padding-top:20px}
.match h1{font-family:var(--display);font-weight:800;font-size:25px;letter-spacing:-.035em;text-transform:uppercase;margin:0}
.match p{margin:6px 0 0;font-size:14px;color:var(--ink-2)}
.match p b{color:var(--ink);font-weight:600}
.mcard{width:80%;margin:28px auto 0;text-align:left;display:flex;flex-direction:column;gap:6px}
.mcard .ph{aspect-ratio:241/289}
.mcard .pline{margin-top:4px}
.mcard .pline b{font-size:14px}
.mcard .pline .tnum{font-size:16px}

/* ---------- about / contact ---------- */
.darkbox{background:var(--night);color:var(--on-night);border-radius:4px;padding:28px 22px 30px;margin-top:4px}
.darkbox h1{font-family:var(--display);font-weight:800;font-size:34px;line-height:1.02;letter-spacing:-.03em;text-transform:uppercase;margin:0;text-wrap:balance}
.darkbox h2{font-family:var(--display);font-weight:600;font-size:17px;margin:22px 0 10px}
.darkbox p{margin:0 0 10px;font-size:14px;color:#D7D7D3;line-height:1.55;text-wrap:pretty}
.ab-img{aspect-ratio:359/246;margin-top:16px;border-radius:2px}
.ab-p{margin:16px 0 0;color:var(--ink-2);font-size:14.5px;line-height:1.55;text-wrap:pretty}
.farmers{display:flex;flex-direction:column;gap:16px;margin-top:20px}
.farm{border-radius:var(--r-card);background:var(--surface);overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.06),0 2px 6px rgba(0,0,0,.06)}
.farm .ph{aspect-ratio:359/191;border-radius:0;outline:0}
.farm .bd{padding:16px 16px 20px;display:flex;flex-direction:column;gap:4px}
.farm .bd .k{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.farm .bd b{font-family:var(--display);font-weight:600;font-size:17px}
.farm .bd small{font-size:13.5px;color:var(--ink-2)}
.farm .bd p{margin:6px 0 0;font-size:14px;color:var(--muted)}
.contact{position:relative;margin-top:4px;color:#fff;overflow:hidden;border-radius:2px}
.contact .bg{position:absolute;inset:0;background-size:cover;background-position:center}
.contact .bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.5),rgba(0,0,0,.6))}
.contact .in{position:relative;padding:72px 30px 56px;display:flex;flex-direction:column;gap:18px}
.contact h1{font-family:var(--display);font-weight:700;font-size:42px;line-height:1.03;letter-spacing:-.02em;text-transform:uppercase;margin:0;text-wrap:balance}
.contact p{margin:0;font-size:15.5px;line-height:1.5;text-shadow:0 1px 8px rgba(0,0,0,.3);text-wrap:pretty}
.cform{margin-top:20px;display:flex;flex-direction:column;gap:12px}
.cform .inp input,.cform .inp textarea{background:var(--surface)}
.cok{margin-top:20px;padding:16px;border-radius:8px;background:var(--surface);box-shadow:0 0 0 1px var(--line);font-size:14.5px}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:80;width:min(408px, calc(100% - 32px));translate:-50% 8px;background:var(--ink);color:#fff;border-radius:8px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;opacity:0;pointer-events:none;transition-property:opacity,translate;transition-duration:.2s;transition-timing-function:var(--ease)}
.toast.show{opacity:1;translate:-50% 0;pointer-events:auto}
.toast button{color:#fff;font-weight:600;text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
.page{animation:pin .25s var(--ease) both}
@keyframes pin{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

    <div class="qprog">${S.quiz.step+1}/3<div class="bar"><i style="width:${(S.quiz.step+1)/3*100}%"></i></div></div>
    <div class="qq"><div class="eyebrow">${Q.k}</div><h2>${Q.q}</h2></div>
    <div class="qopts" role="radiogroup" aria-label="${Q.q}">${Q.o.map((o,i)=>`<button class="qopt" role="radio" data-qa="${i}" aria-checked="${a===i}"><span class="bx"></span>${o}</button>`).join('')}</div>
    <div class="qnext"><button class="btn" data-qnext ${a===null?'disabled':''}>${S.quiz.step===2?'See my match':'Next'}</button>
    ${S.quiz.step>0?`<button class="more" style="margin:18px auto 0;display:flex;font-size:14px" data-qback>Back</button>`:''}</div>
  </div>`;
},

match(){
  const a = S.quiz.a; if(a.includes(null)) return pages.quiz();
  const p = byId(matchFor(a));
  const label = QUIZ.map((Q,i)=>Q.short[a[i]]).join(' + ');
  return `<div class="g qview">
    <div class="qhead">${crumbs([['Home','home'],['Quiz']])}<button class="qx" data-go="home" aria-label="Close quiz">${I.xl}</button></div>
    <div class="match"><h1>Your perfect match</h1><p>Based on the selected combination:<br><b>${label}</b></p></div>
    <div class="mcard"><div class="ph" data-product="${p.id}" role="link" tabindex="0" style="cursor:pointer">${img(p.img,p.name)}<div class="tags">${p.tags.map(t=>`<span>${t}</span>`).join('')}</div></div>
      <div class="pline"><b>${p.name}</b><span class="tnum">${fmt(p.price)}</span></div><div class="sub">${p.sub}</div></div>
    <div class="stack" style="margin-top:36px"><button class="btn" data-product="${p.id}">Find out more</button><button class="more" style="margin:0 auto;font-size:14px" data-quiz>Retake the quiz</button></div>
  </div>`;
},

about(){
  return `<div class="g">
    <div class="darkbox">
      <h1>Roastery with roots in the mountains.</h1>
      <h2>The story behind Bergmann Coffee</h2>
      <p>From Erzurum’s mountain villages to the farms we partner with around the world.</p>
      <p>Bergmann Coffee Roastery Berlin is built on a simple idea: coffee should be honest, expressive, and unforgettable.</p>
      <p>Rooted in Berlin’s dynamic coffee culture, we are a small-batch roastery dedicated to sourcing exceptional beans and unlocking their full character through careful roasting. We work closely with trusted producers and importers who share our commitment to quality, transparency, and sustainability.</p>
      <h2>Our Philosophy</h2>
      <p>Coffee is more than a drink. It’s a craft. We believe great coffee starts long before it reaches the roaster. It begins with farmers, climate, soil, and process. Our role is to respect that work and bring out what’s already there.</p>
      <p style="margin:0">At Bergmann, we roast to highlight clarity, balance, and individuality. No shortcuts, no over-roasting. Just precision and care.</p>
    </div>
    <h2 class="h3" style="margin-top:36px;font-weight:500">Bergmann Coffee Shop</h2>
    <div class="ph ab-img">${img('shop','Bergmann café storefront')}</div>
    <p class="ab-p">Founder Begüm grew up in the mountain villages of Erzurum, where tea was the daily ritual. After moving to Berlin and discovering specialty coffee, she saw an opportunity to bridge two worlds: the warmth of Turkish hospitality and the craft of single-origin roasting. Bergmann was born from that vision.</p>
    <h2 class="h3" style="margin-top:40px;font-weight:500">The People Behind the Beans</h2>
    <p class="ab-p" style="margin-top:6px">We work directly with farmers who share our commitment to quality and sustainability.</p>
    <div class="farmers">
      ${[['farm1','Ethiopia','Guji Highlands Cooperative','2,100 m elevation','Around 800 member families deliver cherries to a shared washing station. We pay a fixed premium above market price for every lot.','ethiopian'],
         ['farm2','Colombia','Finca El Paraíso','1,850 m elevation','Diego Bermúdez experiments with fermentation on his family farm in Cauca. His thermal-shock lots are behind our El Paraíso release.','paraiso'],
         ['farm3','Kenya','Kirinyaga Smallholders','1,700 m elevation','Cherries are sun-dried on raised beds on the slopes of Mount Kenya. This is where our Kenyan AA comes from.','kenyan']]
       .map(([im,k,n,e,t,pid])=>`<button class="farm" data-product="${pid}" style="text-align:left"><div class="ph">${img(im,n)}</div><div class="bd"><span class="k">${k}</span><b>${n}</b><small class="tnum">${e}</small><p>${t}</p></div></button>`).join('')}
    </div>
  </div>`;
},

contact(){
  return `<div class="g">
    <div class="contact"><div class="bg" style="background-image:url(${IMG.hero})"></div>
      <div class="in"><h1>Not your typical coffee.</h1>
        <p>Our focus has always been simple: make coffee taste unnecessarily good, and keep it that way, every time. The quality never changes, only the experience. Same same, but different. Behind every cup is the work of countless individuals, each choice along the way made with one goal in mind: how it tastes in yours.</p>
        <button class="btn" data-contactform>Get in touch</button></div>
    </div>
    ${S.contactSent?`<div class="cok"><b>Thanks, we got your message.</b><br>Our wholesale team replies within two business days.</div>`:
      S.showContact?`<form class="cform" id="cform" novalidate>
        <h2 class="formh" style="margin:12px 0 0">Wholesale & questions</h2>
        <div class="inp"><input id="c-name" placeholder="Name or café" aria-label="Name or café"></div>
        <div class="inp"><input id="c-email" type="email" placeholder="Email address" aria-label="Email address"></div>
        <div class="inp"><textarea id="c-msg" placeholder="How can we help?" aria-label="Message"></textarea></div>
        <button class="btn" type="submit">Send message</button></form>`:''}
  </div>`;
}
};

const QUIZ = [
  {k:'Brew method', q:'How do you usually make your coffee?', o:['Espresso machine','Pour over / Filter','French press / Moka pot','Instant / Capsule'], short:['Espresso Machine','Pour Over','French Press','Capsule']},
  {k:'Taste preference', q:'What flavors do you enjoy most?', o:['Chocolate & nutty — rich and comforting','Fruity & floral — bright and juicy','Caramel & sweet — smooth and balanced','Bold & smoky — strong and intense'], short:['Chocolate & Nutty','Fruity & Floral','Caramel & Sweet','Bold & Smoky']},
  {k:'Strength', q:'How strong do you like your coffee?', o:['Light — smooth and easy','Medium — balanced kick','Strong — I want to feel it','Max power — the stronger the better'], short:['Light','Medium','Strong','Max Power']},
];
function matchFor([brew,flavor,strength]){
  if(flavor===1) return strength>=2 ? 'paraiso' : 'ethiopian';
  if(flavor===0) return 'santos';
  if(flavor===2) return strength>=2 ? 'santos' : 'supremo';
  return 'kenyan';
}

function stepsBar(n){
  return `<div class="steps"><span class="s ${n===1?'on':'done'}"><i>${n===1?'1':I.check}</i>Info</span><hr><span class="s ${n===2?'on':''}"><i>2</i>Payment</span></div>`;
}
function cartLine(l,i,editable){
  const p = byId(l.id);
  const v = isCoffee(p) ? `${l.variant} · ${l.grind}` : p.cat==='shirts' ? `Size ${l.variant}` : p.sub;
  return `<div class="ccard">
    <div class="ph" data-product="${p.id}" role="link" tabindex="0" aria-label="${p.name}">${img(p.img,p.name)}</div>
    <div class="info"><span class="k">${p.cat==='coffee'?'Coffee':p.cat==='brew'?'Brewing gear':'Apparel'}</span><span class="n">${p.name}</span><span class="v">${v}</span>
      <div class="b"><span class="tnum">${fmt(lineTotal(l))}</span>${editable?`<span class="stepper"><button data-lq="${i}:-1" aria-label="Fewer">−</button><span>${l.qty}</span><button data-lq="${i}:1" aria-label="More">+</button></span>`:`<span class="v tnum">× ${l.qty}</span>`}</div></div>
    ${editable?`<button class="x" data-rm="${i}" aria-label="Remove ${p.name}">${I.x}</button>`:''}
  </div>`;
}

/* ---------- router ---------- */
const VALID = ['home','shop','cart','checkout','payment','confirmed','quiz','match','about','contact'];
function parse(){
  const h = location.hash.slice(1);
  if(h.startsWith('product-')) return {r:'product', id:h.slice(8)};
  return {r: VALID.includes(h)?h:'home'};
}
function nav(hash){ if(location.hash==='#'+hash) render(true); else location.hash = hash; }
let lastRoute='';
function render(scrollTop){
  const {r,id} = parse();
  const view = $('#view');
  const keep = !scrollTop && lastRoute===location.hash ? window.scrollY : 0;
  view.innerHTML = `<div class="page">${pages[r](id)}</div>`;
  if(lastRoute!==location.hash || scrollTop) window.scrollTo(0,0); else window.scrollTo(0,keep);
  if(lastRoute===location.hash) view.firstChild.classList.remove('page');
  lastRoute = location.hash;
  // header mode
  const hdr = $('#hdr'); hdr.classList.toggle('over', r==='home'); onScroll();
  $('#cartCount').innerHTML = count() ? `<span class="cbadge tnum">${count()}</span>` : '';
  $('#cartBtn').setAttribute('aria-label', `Cart, ${count()} item${count()===1?'':'s'}`);
  document.querySelectorAll('#menuNav button').forEach(b=>b.setAttribute('aria-current', (b.dataset.go===r || (r==='product'&&b.dataset.go==='shop')) ? 'page':'false'));
  wire(r,id);
}
function rerender(){ const y=window.scrollY; const {r,id}=parse(); $('#view').innerHTML = pages[r](id); window.scrollTo(0,y); $('#cartCount').innerHTML = count()?`<span class="cbadge tnum">${count()}</span>`:''; wire(r,id); }
function onScroll(){ const hdr=$('#hdr'); if(hdr.classList.contains('over')) hdr.classList.toggle('solid', window.scrollY>360); }
window.addEventListener('scroll', onScroll, {passive:true});
window.addEventListener('hashchange', ()=>{ closeMenu(); render(); });

function wire(r,id){
  if(r==='shop'){ const q=$('#q'); q.addEventListener('input',e=>{ S.q=e.target.value; const pos=q.selectionStart; rerender(); const n=$('#q'); n.focus(); n.setSelectionRange(pos,pos); }); }
  if(r==='product'){
    const t=$('#track'); if(t){ const st=S.pdp[(byId(id)||byId('ethiopian')).id]; t.addEventListener('scroll',()=>{ const i=Math.round(t.scrollLeft/t.clientWidth); if(i!==st.slide){ st.slide=i; document.querySelectorAll('.dots i').forEach((d,k)=>d.classList.toggle('on',k===i)); } },{passive:true}); }
    const g=$('#grind'); if(g) g.addEventListener('change',e=>{ S.pdp[id].grind=e.target.value; });
  }
  if(r==='checkout'){ const f=$('#infoForm'); if(f) f.addEventListener('submit', submitInfo); }
  if(r==='contact'){ const f=$('#cform'); if(f) f.addEventListener('submit', e=>{ e.preventDefault();
      const ok = $('#c-name').value.trim() && /\S+@\S+\.\S+/.test($('#c-email').value) && $('#c-msg').value.trim();
      if(!ok){ ['c-name','c-email','c-msg'].forEach(k=>{ const el=$('#'+k); el.parentElement.classList.toggle('bad', !el.value.trim() || (k==='c-email'&&!/\S+@\S+\.\S+/.test(el.value))); }); return toast('Fill in your name, a valid email and a message.'); }
      S.contactSent=true; rerender(); }); }
}

/* ---------- checkout logic ---------- */
function readInfo(){ const g=k=>($('#f-'+k)?.value||'').trim(); return {email:g('email'),first:g('first'),last:g('last'),address:g('address'),apt:g('apt'),zip:g('zip'),city:g('city'),country:$('#f-country').value,phone:g('phone'),news:$('#f-news').checked}; }
function submitInfo(e){
  e.preventDefault();
  const f = readInfo(), err = {};
  if(!/^\S+@\S+\.\S+$/.test(f.email)) err.email='Enter an email like name@example.com';
  if(!f.first) err.first='Enter your first name';
  if(!f.last) err.last='Enter your last name';
  if(!f.address) err.address='Enter your street and house number';
  if(!/^\d{5}$/.test(f.zip)) err.zip='Use a 5-digit postal code';
  if(!f.city) err.city='Enter your city';
  S.info = f; S.errors = err;
  if(Object.keys(err).length){ rerender(); const first=document.querySelector('.inp.bad input'); if(first) first.focus(); return; }
  S.errors = {}; nav('payment');
}
function addBusinessDays(d,n){ const x=new Date(d); while(n>0){ x.setDate(x.getDate()+1); const w=x.getDay(); if(w!==0&&w!==6) n--; } return x; }
function etaText(){
  const [a,b] = SHIP[S.ship].days, now=new Date();
  const f = d => d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
  const d1=addBusinessDays(now,a), d2=addBusinessDays(now,b);
  return a===b ? `${f(d1)} ${d1.getFullYear()}` : `${f(d1)} – ${f(d2)} ${d2.getFullYear()}`;
}

/* ---------- cart ops ---------- */
function addToCart(id, variant, grind, qty){
  const p = byId(id); variant = variant || defVariant(p); grind = isCoffee(p) ? (grind||'Whole Bean') : '';
  const ex = S.cart.find(l=>l.id===id && l.variant===variant && l.grind===grind);
  if(ex) ex.qty = Math.min(20, ex.qty+qty); else S.cart.push({id,variant,grind,qty});
  rerender(); const b=document.querySelector('.cbadge'); if(b){ b.classList.add('bump'); }
  toast(`${qty>1?qty+'× ':''}${p.name} added to cart`, {label:'View cart', fn:()=>nav('cart')});
}

/* ---------- toast ---------- */
let tt;
function toast(msg, act){
  const el=$('#toast'), b=$('#toastAct');
  $('#toastMsg').textContent = msg; b.hidden=!act;
  if(act){ b.textContent=act.label; b.onclick=()=>{ el.classList.remove('show'); act.fn(); }; }
  el.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>el.classList.remove('show'), 2800);
}

/* ---------- menu ---------- */
function openMenu(){ $('#menu').classList.add('open'); $('#menu').setAttribute('aria-hidden','false'); $('#menuBtn').setAttribute('aria-expanded','true'); }
function closeMenu(){ $('#menu').classList.remove('open'); $('#menu').setAttribute('aria-hidden','true'); $('#menuBtn').setAttribute('aria-expanded','false'); }
$('#menuBtn').addEventListener('click', openMenu);
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeMenu(); if(e.key==='Enter' && e.target.matches('[role="link"][data-product]')) nav('product-'+e.target.dataset.product); });

/* ---------- events ---------- */
document.addEventListener('click', e=>{
  const t = e.target.closest('button,[data-product],[data-close]'); if(!t) return;
  const d = t.dataset;
  if(d.close!==undefined){ closeMenu(); return; }
  if(d.go){ closeMenu(); return nav(d.go); }
  if(d.soon){ return toast(`${d.soon} isn’t part of this prototype yet.`); }
  if(d.product && !d.add){ return nav('product-'+d.product); }
  if(d.quiz!==undefined){ S.quiz={step:0,a:[null,null,null]}; return nav('quiz'); }
  if(d.shopcat){ S.shopCat=d.shopcat; S.showAll=false; S.q=''; return nav('shop'); }
  if(d.cat){ S.shopCat=d.cat; S.showAll=false; return rerender(); }
  if(d.filters!==undefined){ S.showFilters=!S.showFilters; return rerender(); }
  if(d.roast){ const i=S.roastFilter.indexOf(d.roast); i<0?S.roastFilter.push(d.roast):S.roastFilter.splice(i,1); return rerender(); }
  if(d.clearf!==undefined){ S.roastFilter=[]; return rerender(); }
  if(d.showall!==undefined){ S.showAll=true; return rerender(); }
  if(d.cq){ const [k,n]=d.cq.split(':'); S.cardQty[k]=Math.max(1,Math.min(20,(S.cardQty[k]||1)+ +n)); return rerender(); }
  if(d.add){ const q=d.qkey?(S.cardQty[d.qkey]||1):1; if(d.qkey) S.cardQty[d.qkey]=1; return addToCart(d.add,null,null,q); }
  if(d.pq){ const {id}=parse(); const st=S.pdp[byId(id)?id:'ethiopian']; st.qty=Math.max(1,Math.min(20,st.qty+ +d.pq)); return rerender(); }
  if(d.variant){ const {id}=parse(); S.pdp[byId(id)?id:'ethiopian'].variant=d.variant; return rerender(); }
  if(d.addpdp){ const st=S.pdp[d.addpdp]; return addToCart(d.addpdp, st.variant, st.grind, st.qty); }
  if(d.lq){ const [i,n]=d.lq.split(':').map(Number); S.cart[i].qty+=n; if(S.cart[i].qty<1){ return removeLine(i); } return rerender(); }
  if(d.rm){ return removeLine(+d.rm); }
  if(d.ship){ S.ship=d.ship; return rerender(); }
  if(d.pay){ S.pay=d.pay; return rerender(); }
  if(d.prefill!==undefined){ S.info={email:'anna.schmidt@example.com',first:'Anna',last:'Schmidt',address:'Bergmannstraße 45',apt:'',zip:'10961',city:'Berlin',country:'Germany',phone:'',news:false}; S.errors={}; return rerender(); }
  if(d.paynow!==undefined){
    const t=totals(); S.order={no:'BG-'+(10480+Math.floor(Math.random()*500)), first:S.info.first, email:S.info.email, eta:etaText(), total:t.total};
    S.cart=[]; return nav('confirmed');
  }
  if(d.qa){ S.quiz.a[S.quiz.step]=+d.qa; return rerender(); }
  if(d.qnext!==undefined){ if(S.quiz.a[S.quiz.step]===null) return; if(S.quiz.step<2){ S.quiz.step++; return render(true); } return nav('match'); }
  if(d.qback!==undefined){ S.quiz.step--; return render(true); }
  if(d.contactform!==undefined){ S.showContact=true; rerender(); const n=$('#c-name'); if(n){ n.focus(); n.scrollIntoView({behavior:'smooth',block:'center'}); } return; }
});
function removeLine(i){ const l=S.cart.splice(i,1)[0]; rerender(); toast(`${byId(l.id).name} removed`, {label:'Undo', fn:()=>{ S.cart.splice(i,0,l); rerender(); }}); }

render();
</script>
</body>
</html>
